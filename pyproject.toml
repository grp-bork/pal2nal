[project]
name = "pal2nal"
dynamic = ["version"]
description = "Convert a protein sequence alignment and the corresponding DNA sequences into a codon alignment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mikita Suyama" },
]
keywords = ["bioinformatics", "alignment", "codon", "genetics", "phylogenetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[project.urls]
Repository = "https://github.com/grp-bork/pal2nal"
Issues = "https://github.com/grp-bork/pal2nal/issues"

[project.scripts]
pal2nal = "pal2nal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pal2nal*"]

# One place holds the version: pal2nal/__init__.py. setuptools reads it
# from there at build time, so the distribution metadata that
# importlib.metadata.version("pal2nal") reports cannot drift from what the
# package itself reports, and neither needs updating by hand twice.
[tool.setuptools.dynamic]
version = { attr = "pal2nal.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
